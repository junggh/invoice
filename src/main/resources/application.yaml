spring:
  application:
    name: demo
  datasource:
    # docker-compose에 설정한 포트(5432)와 DB이름(invoicedb)
    url: jdbc:postgresql://localhost:5432/invoicedb
    # docker-compose에 설정한 아이디
    username: newzen
    # docker-compose에 설정한 비밀번호
    password: 1234
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update # 테이블이 없으면 자동으로 만들어줌
    show-sql: true
    properties:
      hibernate:
        format_sql: true # 실행되는 SQL을 보기 좋게 정렬
