<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>View Invoice</title>
    <link rel="stylesheet" href="/css/newinvoicestyle.css">
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>View Invoice</h1>
            <span style="color: #888;" th:text="'# ' + ${invoice.invoiceNumber}"></span>
        </div>
        <h3 style="margin-top:0;">Invoice Details</h3>
        <div class="form-grid">
            <div class="section-left">
                <div class="form-group">
                    <label for="customerName">Contact Name</label>
                    <input type="text" id="customerName" name="customerName" th:value="${invoice.customerName} + (${invoice.customerCompanyName != null} ? ' (' + ${invoice.customerCompanyName} + ')' : '')" readonly>
                </div>


                <div class="form-grid" style="grid-template-columns: 1fr 1fr 1fr; gap: 10px; margin-bottom: 0px;">
                    <div class="form-group">
                        <label for="customerCurrency">Currency</label>
                        <input type="text" id="customerCurrency" name="customerCurrency" th:value="${invoice.customerCurrency}" readonly>
                    </div>

                    <div class="form-group">
                        <label for="customerBillTo">Bill To</label>
                        <input type="text" id="customerBillTo" name="customerBillTo" th:value="${invoice.customerBillTo}" readonly>
                    </div>

                    <div class="form-group">
                        <label for="salesPerson">Salesperson</label>
                        <input type="text" id="salesPerson" name="salesPerson" th:value="${invoice.salesPerson}" readonly>
                    </div>
                </div>
            </div>

            <div class="section-right">
                <div class="form-grid" style="grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 0px">
                    <div class="form-group">
                        <label for="invoiceNumber">Invoice #</label>
                        <input type="text" id="invoiceNumber" name="invoiceNumber" th:value="${invoice.invoiceNumber}"
                               readonly style="background-color: #f0f0f0;">
                    </div>

                    <div class="form-group">
                        <label for="reference">Reference</label>
                        <input type="number" id="reference" name="reference" th:value="${invoice.reference}" readonly>
                    </div>
                </div>

                <!--<div class="form-group">
                    <label for="status">Status</label>
                    <input type="text" id="status" name="status" th:value="${invoice.status}" readonly>
                </div>-->

                <div class="form-grid" style="margin-bottom: 0; grid-template-columns: 1fr 1fr; gap: 10px;">
                    <div class="form-group">
                        <label for="issuedDate">Issued Date</label>
                        <input type="text" id="issuedDate" name="issuedDate" th:value="${#temporals.format(invoice.issuedDate, 'dd / MM / yyyy')}" readonly>
                    </div>
                    <div class="form-group">
                        <label for="dueDate">Due Date</label>
                        <input type="text" id="dueDate" name="dueDate" th:value="${#temporals.format(invoice.dueDate, 'dd / MM / yyyy')}" readonly>
                    </div>
                </div>
            </div>
        </div>

        <h3>Items</h3>
        <table class="items-table">
            <thead>
            <tr>
                <th>Product</th>
                <th>Description</th>
                <th class="width-sm text-right">Price</th>
                <th class="width-sm text-right">Quantity</th>
                <th class="width-sm text-right">Discount</th>
                <th class="width-sm text-right">Amount</th>
                <th style="width: 20px;"></th>
            </tr>
            </thead>
            <tbody id="invoiceItems">
            <tr th:each="item : ${invoice.items}" class="item-row">
                <td>
                    <input type="text" th:value="${item.product.name}" style="width: 95%;" readonly>
                </td>
                <td>
                    <input type="text" th:value="${item.product.description}" style="width: 95%;" readonly>
                </td>
                <td>
                    <input type="number" th:value="${item.product.price}" class="text-right" style="width: 95%;" readonly>
                </td>
                <td>
                    <input type="number" th:value="${item.quantity}" class="text-right" style="width: 95%;" readonly>
                </td>
                <td>
                    <input type="number" th:value="${item.discount}" class="text-right" style="width: 95%;" readonly>
                </td>
                <td class="text-right" style="vertical-align: middle;">
                    <span th:text="${item.amount}">0.00</span>
                </td>
                <td></td>
            </tr>
            </tbody>
        </table>

        <div style="display: flex; justify-content: flex-end; margin-top: 20px;">
            <div style="width: 250px;">
                <div style="display: flex; justify-content: space-between; margin-bottom: 10px;">
                    <span>Subtotal</span>
                    <span id="subtotal" style="font-weight: bold;"
                          th:text="${subtotal != null ? #numbers.formatDecimal(subtotal, 1, 2) : '0.00'}">0.00</span>
                </div>
                <div style="display: flex; justify-content: space-between; margin-bottom: 10px; color: #888;">
                    <span>Tax (10%)</span>
                    <span id="tax"
                          th:text="${tax != null ? #numbers.formatDecimal(tax, 1, 2) : '0.00'}">0.00</span>
                </div>
                <div style="display: flex; justify-content: space-between; border-top: 2px solid #333; padding-top: 10px; font-size: 18px; font-weight: bold;">
                    <span>Total Amount</span>
                    <span style="color: var(--primary-color);"
                          th:text="${invoice.total != null ? #numbers.formatDecimal(invoice.total, 1, 2) : '0.00'}">0.00</span>
                </div>
            </div>
        </div>

        <div class="actions">
            <div th:if="${#strings.toString(invoice.status) == 'UNPAID' or #strings.toString(invoice.status) == 'OVERDUE'}"
                 style="margin-right: auto; display: flex; gap: 12px;">
                <button type="button" class="btn btn-secondary">Create payment link</button>
                <button type="button" class="btn btn-secondary">Record partial payment</button>
            </div>

            <button type="button" onclick="location.href='/invoices'" class="btn btn-secondary">Cancel</button>
<!--            <button type="button" th:onclick="|location.href='@{/invoices/{id}/edit(id=${invoice.id})}'|" class="btn btn-primary">Edit Invoice</button>-->
        </div>
    </div>
</body>
</html>
