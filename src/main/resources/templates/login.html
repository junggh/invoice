<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Login</title>
    <link rel="stylesheet" href="/css/authstyle.css">
</head>
<body>

<div class="auth-container small"> <h2>Welcome Back</h2>

    <form action="/login" method="post">

        <div class="form-group">
            <label for="email">Email</label>
            <input type="email" id="email" name="email" required
                   placeholder="name@example.com"
                   th:value="${lastEmail}">
        </div>

        <div class="form-group">
            <label for="password">Password</label>
            <input type="password" id="password" name="password" required
                   placeholder="Enter Password">
        </div>

        <div class="step-actions">
            <button type="submit" class="btn btn-primary" style="width: 100%;">Sign In</button>
        </div>

        <div style="text-align: center; margin-top: 20px; display: flex; flex-direction: column; gap: 12px;">
            <a href="/signup?type=admin" style="text-decoration: none; color: var(--primary-color); font-weight: 600;">Create a Business Account</a>
            <a href="/signup?type=member" style="text-decoration: none; color: #666; font-size: 14px;">Create a Member Account</a>
        </div>
    </form>

    <div th:if="${param.error}" style="color: red; margin-top: 20px; text-align: center;">
        Invalid email or password.
    </div>
    <div th:if="${param.logout}" style="color: green; margin-top: 20px; text-align: center;">
        You have been logged out.
    </div>
</div>

</body>
</html>
