<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Sign Up</title>
    <link rel="stylesheet" href="/css/authstyle.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/intl-tel-input@19.2.16/build/css/intlTelInput.css">
    <script src="https://cdn.jsdelivr.net/npm/intl-tel-input@19.2.16/build/js/intlTelInput.min.js"></script>
</head>
<body>

<div class="auth-container">
    <h2 id="pageTitle">Create your account</h2>

    <div th:if="${errorMessage}" style="color: red; margin-bottom: 15px;" th:text="${errorMessage}"></div>

    <form th:action="@{/signup}" th:object="${signupForm}" method="post" id="signupForm">

        <div class="step-section active" id="step1">
            <h3 style="margin-top: 0; color: #666; font-size: 18px; margin-bottom: 20px;">Personal Details</h3>

            <div class="form-group">
                <label>First Name</label>
                <input type="text" th:field="*{firstName}" required>
            </div>
            <div class="form-group">
                <label>Last Name</label>
                <input type="text" th:field="*{lastName}" required>
            </div>

            <div class="form-group">
                <label>Email (Username)</label>
                <input type="email" th:field="*{personalEmail}" id="personalEmail" required
                       placeholder="you@example.com" oninput="resetEmailError()">
                <div id="emailErrorMsg" style="font-size: 13px; margin-top: 5px; display: none; color: red;"></div>
            </div>

            <div class="form-group">
                <label>Password</label>
                <input type="password" th:field="*{password}" id="password" required>
            </div>

            <div class="form-group">
                <label>Confirm Password</label>
                <input type="password" th:field="*{checkPassword}" id="checkPassword" required oninput="resetPasswordError()">
                <div id="pwError" style="font-size: 13px; margin-top: 5px; display: none; color: red;">Passwords do not match.</div>
            </div>

            <div class="form-group">
                <label>Country</label>
                <select th:field="*{memberCountry}" id="memberCountrySelect" required style="width: 100%; padding: 10px;">
                    <option value="">Select Country</option>
                </select>
            </div>

            <div class="form-group">
                <label>Phone (Personal)</label>
                <input type="hidden" id="personalCountryCode" th:field="*{personalCountryCode}">
                <input type="tel" id="personalPhone" th:field="*{personalPhone}"
                       style="padding-left: 60px !important;">
            </div>

            <div style="margin-top: 20px; font-size: 14px;">
                <label style="font-weight: normal; display: flex; align-items: flex-start; gap: 8px;">
                    <input type="checkbox" th:field="*{agreeTerms}" required style="margin-top: 3px;">
                    <span>I have read and agree to the Terms of Service and Privacy Policy. <span style="color:red">*</span></span>
                </label>
                <label style="font-weight: normal; display: flex; align-items: flex-start; gap: 8px; margin-top: 10px;">
                    <input type="checkbox" th:field="*{marketingConsent}" style="margin-top: 3px;">
                    <span>Yes, I want to receive product updates via email.</span>
                </label>
            </div>

            <div class="step-actions">
                <button type="button" class="btn btn-primary" style="width: auto;" onclick="validateStep1AndNext()">Next</button>
            </div>
        </div>

        <div class="step-section" id="step2">
            <div style="text-align: center; padding: 40px 0;">
                <h3>Verification</h3>
                <p style="color: #666; margin-bottom: 30px;">
                    We sent a verification code to <span id="displayEmail" style="font-weight: bold;"></span>
                </p>
                <div class="verification-input-group">
                    <div class="input-wrapper">
                        <input type="text" id="verificationCode" placeholder="Enter Code" maxlength="6">
                        <span id="timerDisplay">03:00</span>
                    </div>
                </div>
                <div id="verifyErrorMsg" style="color: red; font-size: 13px; margin-top: 10px; display: none;"></div>

                <a href="javascript:void(0)" onclick="resendCode()" id="resendLink"
                   style="display: block; margin-top: 20px; color: var(--primary-color); text-decoration: none;">
                    Resend Code
                </a>
            </div>

            <div class="step-actions">
                <button type="button" class="btn btn-secondary" onclick="prevStep(1)">Back</button>
                <button type="button" class="btn btn-primary" style="width: auto;" onclick="verifyAndNext()">Verify & Next</button>
            </div>
        </div>

        <div class="step-section" id="step3">
            <h3 style="margin-top: 0;">Set your business</h3>

            <div class="form-group">
                <label>Country</label>
                <select th:field="*{country}" id="businessCountry" required>
                    <option value="">Select Country</option>
                    <option value="Australia">Australia</option>
                    <option value="United Kingdom">United Kingdom</option>
                </select>
            </div>

            <div style="display: flex; gap: 15px;">
                <div class="form-group" style="flex: 2;">
                    <label>Business Timezone</label>
                    <select th:field="*{companyTimezone}" id="companyTimezone">
                        <option value="">Select Timezone</option>
                        <option th:each="tz : ${timezones}"
                                th:value="${tz}"
                                th:text="${tz.displayValue}">UTC+09:00</option>
                    </select>
                </div>

                <div class="form-group" style="flex: 1;">
                    <label>Currency</label>
                    <select th:field="*{currency}" id="companyCurrency">
                        <option value="">Select</option>
                        <option value="AUD">AUD</option>
                        <option value="GBP">GBP</option>
                    </select>
                </div>
            </div>

            <div class="form-group">
                <label>Business Name</label>
                <input type="text" id="businessName" th:field="*{businessName}" required>
            </div>

            <div class="form-group" style="position: relative;">
                <label>ABN</label>
                <input type="text" id="abnInput" th:field="*{abn}" placeholder="Search ABN..."
                       style="padding-right: 40px;" oninput="resetAbnResult()">
                <i class="bi bi-search" onclick="searchAbn()"
                   style="position: absolute; right: 12px; top: 38px; color: #999; cursor: pointer;"></i>
                <div id="abnResultMsg" style="font-size: 13px; margin-top: 5px; display: none;"></div>
            </div>

            <input type="hidden" id="hiddenEntityName" th:field="*{entityName}">
            <input type="hidden" id="hiddenEntityTypeName" th:field="*{entityTypeName}">
            <input type="hidden" id="hiddenAbnStatus" th:field="*{abnStatus}">
            <input type="hidden" id="hiddenAddressPostcode" th:field="*{addressPostcode}">
            <input type="hidden" id="hiddenAddressState" th:field="*{addressState}">
            <input type="hidden" id="hiddenGst" th:field="*{gst}">

            <div class="form-group">
                <label>Business Industry</label>
                <select th:field="*{industry}">
                    <option value="">Select Industry</option>
                    <option value="IT">IT & Software</option>
                    <option value="Retail">Retail</option>
                    <option value="Consulting">Consulting</option>
                </select>
            </div>

            <div class="form-group">
                <label>Financial Year End</label>
                <div style="display: flex; gap: 10px;">
                    <input type="number" th:field="*{financialYearDay}" placeholder="Day (e.g. 30)" min="1" max="31">
                    <select th:field="*{financialYearMonth}">
                        <option th:each="month : ${months}"
                                th:value="${month}"
                                th:text="${#strings.capitalize(#strings.toLowerCase(month))}">
                            January
                        </option>
                    </select>
                </div>
            </div>

            <div class="form-group">
                <label>Website</label>
                <input type="text" th:field="*{website}" placeholder="https://">
            </div>

            <div class="form-group">
                <label>Company Email</label>
                <input type="email" th:field="*{companyEmail}" placeholder="support@company.com">
            </div>

            <div class="form-group">
                <label>Company Phone</label>
                <input type="hidden" id="companyCountryCode" th:field="*{companyCountryCode}">
                <input type="tel" id="companyPhone" th:field="*{companyPhone}"
                       style="padding-left: 60px !important;">
            </div>

            <div class="form-group">
                <label>Fax</label>
                <input type="tel" th:field="*{fax}">
            </div>

            <div class="step-actions">
<!--                <button type="button" class="btn btn-secondary" onclick="prevStep(2)">Back</button>-->
                <button type="button" class="btn btn-primary" style="width: auto;" onclick="submitSignup()">Complete Sign Up</button>
            </div>
        </div>

    </form>
</div>

<script src="/js/signup.js"></script>

</body>
</html>
