<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>Customer Users (Super Admin)</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">

  <link rel="stylesheet" th:href="@{/css/homestyle.css}">
  <link rel="stylesheet" th:href="@{/css/layout.css}">
  <style>
    .user-table { width: 100%; border-collapse: collapse; margin-top: 10px; }
    .user-table th, .user-table td { border-bottom: 1px solid var(--border-color); padding: 15px; text-align: left; }
    .role-admin { color: #1976d2; font-weight: bold; }
    .role-user { color: #333; font-weight: bold; }
  </style>
</head>
<body>

<div th:replace="~{fragments/super-admin-nav :: sidebar}"></div>

<div class="main-wrapper">

  <div th:replace="~{fragments/super-admin-nav :: topbar}"></div>

  <div class="content-area">

    <div class="container">

      <div class="header" style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 30px; border-bottom: 1px solid var(--border-color); padding-bottom: 15px;">
        <h2 style="margin: 0;" th:text="${companyName} + ' Members'">Company Name</h2>
        <div>
          <a href="javascript:history.back()" class="btn" style="background: white; border: 1px solid #ddd; color: #555; text-decoration: none;">Back</a>
        </div>
      </div>

      <table class="user-table">
        <thead>
        <tr>
          <th>User</th>
          <th>Role</th>
          <th>Last Login</th>
          <th>Joined</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="user : ${users}">
          <td>
            <strong th:text="${user.name}">User name</strong><br>
            <small style="color:gray;" th:text="${user.email}">email@email.com</small>
          </td>
          <td>
                        <span th:classappend="${user.role == 'ADMIN'} ? 'role-admin' : 'role-user'"
                              th:text="${user.role}">Role</span>
          </td>
          <td style="color: gray;" th:text="${user.lastLogin}">20 mins ago</td>
          <td th:text="${user.joinedDate}">Jan 15 2025</td>
        </tr>
        </tbody>
      </table>

    </div>
  </div>
</div>

</body>
</html>
