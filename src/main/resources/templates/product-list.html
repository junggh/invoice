<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Products</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" th:href="@{/css/homestyle.css}">
    <link rel="stylesheet" th:href="@{/css/layout.css}">
    <style>
        .list-table { width: 100%; border-collapse: collapse; margin-top: 10px; }
        .list-table th, .list-table td { border-bottom: 1px solid var(--border-color); padding: 10px 15px; text-align: left; font-size: 14px; }
        .list-table th { font-weight: 600; color: #555; font-size: 13px; }
        .list-table tbody tr:hover { background-color: #f9f9f9; }
        .empty-state { text-align: center; padding: 60px 20px; color: #999; }
        .empty-state i { font-size: 48px; margin-bottom: 15px; display: block; }
        .price-col { text-align: right; }
    </style>
</head>
<body>

<div th:replace="~{fragments/nav :: sidebar}"></div>

<div class="main-wrapper">

    <div th:replace="~{fragments/nav :: topbar}"></div>

    <div class="content-area">
        <div class="container">

            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; border-bottom: 1px solid var(--border-color); padding-bottom: 15px;">
                <h2 style="margin: 0;">Products</h2>
                <a href="/product/new" class="btn btn-primary" style="text-decoration: none;">+ Add Product</a>
            </div>

            <div th:if="${#lists.isEmpty(products)}" class="empty-state">
                <i class="fas fa-box-open"></i>
                <p>No products yet.</p>
                <a href="/product/new" style="color: var(--primary-color);">Create your first product</a>
            </div>

            <table th:if="${!#lists.isEmpty(products)}" class="list-table">
                <thead>
                <tr>
                    <th>Name</th>
                    <th>Description</th>
                    <th class="price-col">Price</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="p : ${products}">
                    <td><strong th:text="${p.name}">Product</strong></td>
                    <td th:text="${p.description}" style="color: #555;">Description</td>
                    <td class="price-col" th:text="${'$' + #numbers.formatDecimal(p.price, 1, 'COMMA', 2, 'POINT')}">$0.00</td>
                </tr>
                </tbody>
            </table>

        </div>
    </div>
</div>

</body>
</html>
