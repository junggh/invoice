<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Create Contact</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">

    <link rel="stylesheet" th:href="@{/css/homestyle.css}">
    <link rel="stylesheet" th:href="@{/css/layout.css}">
    <style>
        /* 폼 전용 깔끔한 스타일 */
        .form-container { max-width: 600px; margin: 0 auto; min-height: auto; }
        .temp-form-group { margin-bottom: 20px; }
        .temp-form-group label { display: block; margin-bottom: 8px; font-weight: 600; color: #555; font-size: 14px; }
        .temp-form-group input {
            width: 100%; padding: 10px 12px; border: 1px solid var(--border-color);
            border-radius: 6px; font-size: 14px; box-sizing: border-box; transition: border-color 0.2s;
        }
        .temp-form-group input:focus { outline: none; border-color: var(--primary-color); }
        .form-actions { margin-top: 30px; display: flex; gap: 10px; }
    </style>
</head>
<body>

<div th:replace="~{fragments/nav :: sidebar}"></div>

<div class="main-wrapper">

    <div th:replace="~{fragments/nav :: topbar}"></div>

    <div class="content-area">

        <div class="container form-container">
            <h2 style="margin-top: 0; margin-bottom: 30px; border-bottom: 1px solid #eee; padding-bottom: 15px;">Create New Contact</h2>

            <form th:action="@{/contact}" th:object="${contact}" method="post">

                <div class="temp-form-group">
                    <label>Contact Person Name <span style="color:red;">*</span></label>
                    <input type="text" th:field="*{name}" required placeholder="John Doe">
                </div>

                <div class="temp-form-group">
                    <label>Company Name</label>
                    <input type="text" th:field="*{companyName}" placeholder="Client Company Inc.">
                </div>

                <div class="temp-form-group">
                    <label>Email</label>
                    <input type="email" th:field="*{email}" placeholder="client@example.com">
                </div>

                <div class="temp-form-group">
                    <label>Phone Number</label>
                    <input type="text" th:field="*{phoneNumber}" placeholder="010-1234-5678">
                </div>

                <div class="temp-form-group">
                    <label>Currency</label>
                    <input type="text" th:field="*{currency}" placeholder="KRW, USD, AUD...">
                </div>

                <div class="temp-form-group">
                    <label>Bill To Address</label>
                    <input type="text" th:field="*{billTo}" placeholder="Seoul, Korea">
                </div>

                <div class="form-actions">
                    <button type="submit" class="btn btn-primary">Save Contact</button>
                    <button type="button" class="btn" style="background: white; border: 1px solid #ddd; color: #555;" onclick="history.back()">Cancel</button>
                </div>
            </form>

        </div>
    </div>
</div>

</body>
</html>
