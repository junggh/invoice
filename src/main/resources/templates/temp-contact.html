<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Create Contact (Temp)</title>
    <style>
        body { font-family: sans-serif; padding: 20px; }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-weight: bold; }
        input { width: 300px; padding: 8px; }
        button { padding: 10px 20px; background-color: #28a745; color: white; border: none; cursor: pointer; }
    </style>
</head>
<body>

<h2>Create Contact (Temporary)</h2>

<form th:action="@{/contact}" th:object="${contact}" method="post">

    <div class="form-group">
        <label>Contact Person Name</label>
        <input type="text" th:field="*{name}" required placeholder="John Doe">
    </div>

    <div class="form-group">
        <label>Company Name</label>
        <input type="text" th:field="*{companyName}" placeholder="Client Company Inc.">
    </div>

    <div class="form-group">
        <label>Email</label>
        <input type="email" th:field="*{email}" placeholder="client@example.com">
    </div>

    <div class="form-group">
        <label>Phone Number</label>
        <input type="text" th:field="*{phoneNumber}" placeholder="010-1234-5678">
    </div>

    <div class="form-group">
        <label>Currency</label>
        <input type="text" th:field="*{currency}" placeholder="KRW, USD, AUD...">
    </div>

    <div class="form-group">
        <label>Bill To Address</label>
        <input type="text" th:field="*{billTo}" placeholder="Seoul, Korea">
    </div>

    <button type="submit">Save Contact</button>
</form>

<br>
<a href="/invoices">Go to Dashboard</a>

</body>
</html>
