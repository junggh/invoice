<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>

<div th:fragment="invoiceForm(actionUrl, title)">

    <form th:action="${actionUrl}" method="POST" th:object="${invoice}">

        <input type="hidden" name="id" th:if="${invoice.id != null}" th:value="${invoice.id}">
        <input type="hidden" id="hiddenStatus" name="status" th:value="${invoice.status}">

        <div class="header">
            <h1 th:text="${title}">Invoice Template</h1>
            <span style="color: #888;" th:text="'# ' + (${invoice.templateNumber} ?: '-')"></span>
        </div>

        <h3 style="margin-top:0; font-size: 16px;">Invoice Details</h3>

        <div class="form-grid">
            <div class="section-left">
                <div class="form-group">
                    <label for="contactSelect">Contact Name <span style="color:red">*</span></label>
                    <select id="contactSelect" name="contact.id" required style="width: 100%;">
                        <option value="">Select Client</option>
                        <option th:each="c : ${contacts}"
                                th:value="${c.id}"
                                th:text="${c.companyName != null ? c.companyName + ' (' + c.name + ')' : c.name}"
                                th:selected="${invoice.contact != null and c.id == invoice.contact.id}"
                                th:data-name="${c.name}"
                                th:data-address="${c.billTo}"
                                th:data-currency="${c.currency}"
                                th:data-company="${c.companyName}"
                                th:data-email="${c.email}">
                            Samsung Electronics
                        </option>
                    </select>
                </div>

                <div class="form-grid" style="grid-template-columns: 1fr 1fr 1fr; gap: 10px; margin-bottom: 0px;">
                    <div class="form-group">
                        <label for="customerCurrency">Currency</label>
                        <input type="text" id="customerCurrency" name="customerCurrency"
                               th:value="${invoice.contact != null ? invoice.contact.currency : ''}"
                               placeholder="KRW" readonly>
                    </div>

                    <div class="form-group">
                        <label for="customerBillTo">Bill To</label>
                        <input type="text" id="customerBillTo" name="customerBillTo"
                               th:value="${invoice.contact != null ? invoice.contact.billTo : ''}"
                               placeholder="City" readonly>
                    </div>

                    <div class="form-group">
                        <label for="salesPerson">Salesperson</label>
                        <input type="text" id="salesPerson" name="salesPerson"
                               th:value="${invoice.salesPerson}">
                    </div>
                </div>

                <div class="form-grid" style="grid-template-columns: 1fr 1fr 1fr; gap: 10px; margin-bottom: 15px;">
                    <div class="form-group">
                        <label for="frequencyInterval">Interval <span style="color:red">*</span></label>
                        <input type="number" id="frequencyInterval" name="frequencyInterval"
                               th:value="${invoice.frequencyInterval}" min="1" required>
                    </div>

                    <div class="form-group">
                        <label for="frequency">Frequency <span style="color:red">*</span></label>
                        <select id="frequency" name="frequency" required style="width: 100%; height: 42px;"> <option value="" disabled th:selected="${invoice.frequency == null}">Select</option>
                            <option value="DAILY" th:selected="${invoice.frequency != null and invoice.frequency.name() == 'DAILY'}">Daily</option>
                            <option value="WEEKLY" th:selected="${invoice.frequency != null and invoice.frequency.name() == 'WEEKLY'}">Weekly</option>
                            <option value="MONTHLY" th:selected="${invoice.frequency != null and invoice.frequency.name() == 'MONTHLY'}">Monthly</option>
                            <option value="YEARLY" th:selected="${invoice.frequency != null and invoice.frequency.name() == 'YEARLY'}">Yearly</option>
                        </select>
                    </div>

                    <div class="form-group" style="display: flex; flex-direction: column; justify-content: flex-end;">
                        <label style="cursor: pointer; display: flex; align-items: center; justify-content: center; height: 42px; background: #fff; border: 1px solid #E0E0E0; border-radius: 6px; padding: 0 10px; font-size: 14px; color: #333; margin-bottom: 0px;">
                            <input type="checkbox" id="autoSend" name="autoSend"
                                   th:checked="${invoice.autoSend}"
                                   style="margin-right: 8px; width: 16px; height: 16px; cursor: pointer;">
                            Auto Send
                        </label>
                    </div>
                </div>
            </div>

            <div class="section-right">
                <div class="form-grid" style="grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 0px">
                    <div class="form-group">
                        <label for="templateNumber">Template #</label>
                        <input type="text" id="templateNumber" name="templateNumber"
                               th:value="${invoice.templateNumber} ?: '-'"
                               readonly style="background-color: #f9f9f9;">
                    </div>

                    <div class="form-group">
                        <label for="reference">Reference</label>
                        <input type="number" id="reference" name="reference"
                               th:value="${invoice.reference}">
                    </div>
                </div>

                <div class="form-grid" style="margin-bottom: 0; grid-template-columns: 1fr 1fr; gap: 10px;">
                    <div class="form-group">
                        <label for="startDate">Start Date <span style="color:red">*</span></label>
                        <input type="text" id="startDate" name="startDate" class="date-picker"
                               th:value="${invoice.startDate}" required placeholder="dd/MM/yyyy">
                    </div>
                    <div class="form-group">
                        <label for="dueDateDays">Due Date (+Days After)<span style="color:red">*</span></label>
                        <input type="number" id="dueDateDays" name="dueDateDays"
                               th:value="${invoice.dueDateDays}" required>
                    </div>
                </div>

                <div class="form-grid" style="margin-bottom: 0; grid-template-columns: 1fr 1fr; gap: 10px;">
                    <div class="form-group">
                        <label for="endDate">End Date (optional)</label>
                        <input type="text" id="endDate" name="endDate" class="date-picker"
                               th:value="${invoice.endDate}" placeholder="dd/MM/yyyy">
                    </div>
                </div>
            </div>
        </div>

        <h3 style="font-size: 16px; margin-top: 20px;">Items</h3>

        <div class="table-actions">
            <button type="button" class="btn btn-secondary" onclick="addItem()" style="font-size: 18px; line-height: 1; padding: 4px 10px;">+</button>

            <div style="position: relative;">
                <button type="button" class="btn btn-secondary" onclick="toggleDropdown()" style="padding: 6px 12px; font-size: 12px;">
                    Columns <i class="bi bi-caret-down-fill" style="font-size: 10px;"></i>
                </button>
                <div id="columnDropdown" class="dropdown-content">
                    <label style="color: #999;"><input type="checkbox" checked disabled> Product/Service</label>
                    <label style="color: #999;"><input type="checkbox" checked disabled> Description</label>
                    <label style="color: #999;"><input type="checkbox" checked disabled> Price</label>
                    <label style="color: #999;"><input type="checkbox" checked disabled> Quantity</label>
                    <label style="color: #999;"><input type="checkbox" checked disabled> Discount</label>
                    <label style="color: #999;"><input type="checkbox" checked disabled> GST</label>
                    <label style="color: #999;"><input type="checkbox" checked disabled> Amount</label>

                    <hr style="margin: 5px 0; border: 0; border-top: 1px solid #eee;">

                    <label><input type="checkbox" onchange="toggleCol('col-dept', this)"> Department</label>
                    <label><input type="checkbox" onchange="toggleCol('col-project', this)"> Project</label>
                    <label><input type="checkbox" onchange="toggleCol('col-location', this)"> Location</label>
                    <label><input type="checkbox" onchange="toggleCol('col-uom', this)"> UOM</label>
                    <label><input type="checkbox" onchange="toggleCol('col-margin', this)"> Margin</label>
                    <label><input type="checkbox" onchange="toggleCol('col-serial', this)"> Serial No.</label>
                </div>
            </div>

            <div style="margin-left: auto; display: flex; align-items: center; gap: 8px;">
                <label for="taxTypeSelect" style="margin: 0; font-size: 13px; font-weight: normal; color: #666; white-space: nowrap;">Amounts are</label>
                <select th:field="*{taxType}" id="taxTypeSelect" onchange="window.calculateTotal()" class="compact-select">
                    <option th:each="type : ${T(com.example.demo.entity.TaxType).values()}"
                            th:value="${type}"
                            th:text="${type.displayValue}"></option>
                </select>
            </div>
        </div>

        <table class="items-table">
            <thead>
            <tr>
                <th class="col-product">Product/Service</th>
                <th class="col-desc">Description</th>
                <th class="col-price text-right">Price</th>
                <th class="col-qty text-right">Quantity</th>
                <th class="col-discount text-right">Discount</th>
                <th class="col-gst">GST</th>

                <th class="col-dept d-none">Department</th>
                <th class="col-project d-none">Project</th>
                <th class="col-location d-none">Location</th>
                <th class="col-uom d-none">UOM</th>
                <th class="col-margin text-right d-none">Margin</th>
                <th class="col-serial d-none">Serial No.</th>

                <th class="col-amount text-right">Amount</th>
                <th style="width: 25px;"></th>
            </tr>
            </thead>
            <tbody id="invoiceItems">
            <tr th:each="item, stat : ${invoice.items}" class="item-row">

                <input type="hidden" th:name="|items[${stat.index}].id|" th:value="${item.id}">

                <td class="col-product">
                    <select th:name="|items[${stat.index}].product.id|" class="product-select" required>
                        <option value="">Select</option>
                        <option th:each="prod : ${products}" th:value="${prod.id}" th:text="${prod.name}"
                                th:selected="${item.product != null and prod.id == item.product.id}"
                                th:data-price="${prod.price}" th:data-desc="${prod.description}"></option>
                    </select>
                </td>
                <td class="col-desc">
                    <input type="text" th:name="|items[${stat.index}].description|"
                           th:value="${item.product != null ? item.product.description : ''}" readonly>
                </td>
                <td class="col-price">
                    <input type="number" th:name="|items[${stat.index}].price|"
                           th:value="${item.product != null ? item.product.price : ''}"
                           class="text-right calc-input" readonly>
                </td>
                <td class="col-qty">
                    <input type="number" th:name="|items[${stat.index}].quantity|"
                           th:value="${item.quantity}" class="text-right calc-input">
                </td>
                <td class="col-discount">
                    <div class="discount-input-group" style="display: flex; align-items: center;">
                        <input type="number" th:name="|items[${stat.index}].discount|"
                               th:value="${item.discount}" class="text-right calc-input"
                               style="border-right: none; border-top-right-radius: 0; border-bottom-right-radius: 0;">
                        <select th:name="|items[${stat.index}].discountType|" class="discount-type-select calc-input"
                                style="width: 45px; padding: 5px !important; background: #f9f9f9; border-left: 1px solid #ddd; border-top-left-radius: 0; border-bottom-left-radius: 0; cursor: pointer;">
                            <option value="AMOUNT" th:selected="${item.discountType == null or item.discountType.name() == 'AMOUNT'}">$</option>
                            <option value="PERCENT" th:selected="${item.discountType != null and item.discountType.name() == 'PERCENT'}">%</option>
                        </select>
                    </div>
                </td>

                <td class="col-gst">
                    <select th:name="|items[${stat.index}].gstCode|" class="calc-input gst-select" style="width: 100%;">
                        <option th:each="gst : ${T(com.example.demo.entity.GstCode).values()}"
                                th:value="${gst}"
                                th:text="${gst.displayValue}"
                                th:selected="${item.gstCode == gst}"
                                th:data-rate="${gst.rate}">
                            GST on Income
                        </option>
                    </select>
                </td>

                <td class="col-dept d-none">
                    <input type="text" name="tempDept">
                </td>
                <td class="col-project d-none">
                    <input type="text" name="tempProject">
                </td>
                <td class="col-location d-none">
                    <input type="text" name="tempLocation">
                </td>
                <td class="col-uom d-none">
                    <input type="text" name="tempUom">
                </td>
                <td class="col-margin d-none">
                    <input type="text" name="tempMargin" class="text-right">
                </td>
                <td class="col-serial d-none">
                    <input type="text" name="tempSerial">
                </td>

                <td class="col-amount text-right">
                    <span class="amount-display" th:text="${item.amount != null ? #numbers.formatDecimal(item.amount, 1, 'COMMA', 2, 'POINT') : '0.00'}">0.00</span>
                    <input type="hidden" th:name="|items[${stat.index}].amount|" th:value="${item.amount}" class="row-amount">
                    <input type="hidden" th:name="|items[${stat.index}].taxAmount|" class="row-tax">
                </td>

                <td class="delete-cell">
                    <button type="button" th:if="${!stat.first}" onclick="removeRow(this)" style="color:red; background:none; border:none;">&times;</button>
                </td>
            </tr>
            </tbody>
        </table>

        <div style="display: flex; justify-content: flex-end; margin-top: 30px;">
            <div class="totals-container">
                <div class="totals-row">
                    <span>Subtotal</span>
                    <span id="subtotal" style="font-weight: bold;">0.00</span>
                    <input type="hidden" name="subtotal" id="hiddenSubtotal">
                </div>
                <div class="totals-row" style="color: #666;">
                    <span>Tax (10%)</span>
                    <span id="tax">0.00</span>
                    <input type="hidden" name="tax" id="hiddenTax">
                </div>
                <div class="total-final">
                    <span>Total</span>
                    <input type="hidden" name="total" id="hiddenTotal" th:value="${invoice.total}">
                    <span id="totalAmount" style="color: var(--primary-color);" th:text="${invoice.total != null ? #numbers.formatDecimal(invoice.total, 1, 'COMMA', 2, 'POINT') : '0.00'}">0.00</span>
                </div>
            </div>
        </div>

        <div th:if="${warningMessage}"
             style="color: #d9534f; background-color: #fdf7f7; border: 1px solid #d9534f;
                    padding: 10px; margin-top: 20px; border-radius: 6px; text-align: center; font-weight: bold;">
            <i class="bi bi-exclamation-triangle-fill"></i> <span th:text="${warningMessage}"></span>
        </div>

        <div class="actions">
            <button type="button" class="btn btn-secondary" style="margin-right: auto;">
                Create payment link
            </button>

            <button type="button" onclick="location.href='/invoices?status=Recurring'" class="btn btn-secondary">Cancel</button>
            <button type="submit" class="btn btn-primary" onclick="setStatusAndSubmit('DRAFT')">
                Save Changes
            </button>
            <button type="submit" class="btn btn-primary" onclick="setStatusAndSubmit('IN_REVIEW')">
                Save & Submit
            </button>
        </div>

    </form>
</div>

</body>
</html>
