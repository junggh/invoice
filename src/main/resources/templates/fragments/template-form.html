<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>

<div th:fragment="invoiceForm(actionUrl, title)">

    <form th:action="${actionUrl}" method="POST">

        <input type="hidden" name="id" th:if="${invoice.id != null}" th:value="${invoice.id}">

        <input type="hidden" id="hiddenStatus" name="status" th:value="${invoice.status}">

        <div class="header">
            <h1 th:text="${title}">Invoice</h1>
            <span style="color: #888;" th:text="'# ' + ${invoice.templateNumber}"></span>
        </div>

        <h3 style="margin-top:0;">Invoice Details</h3>
        <div class="form-grid">
            <div class="section-left">
                <div class="form-group">
                    <label for="contactSelect">Contact Name <span style="color:red">*</span></label>
                    <select id="contactSelect" name="contact.id" required style="width: 100%;">
                        <option value="">Select Client</option>
                        <option th:each="c : ${contacts}"
                                th:value="${c.id}"
                                th:text="${c.name} + (${c.companyName != null} ? ' (' + ${c.companyName} + ')' : '')"
                                th:selected="${invoice.contact != null and c.id == invoice.contact.id}"
                                th:data-name="${c.name}"
                                th:data-address="${c.billTo}"
                                th:data-currency="${c.currency}"
                                th:data-company="${c.companyName}"
                                th:data-email="${c.email}">
                            Samsung Electronics
                        </option>
                    </select>
                </div>

                <div class="form-grid" style="grid-template-columns: 1fr 1fr 1fr; gap: 10px; margin-bottom: 0px;">
                    <div class="form-group">
                        <label for="customerCurrency">Currency</label>
                        <input type="text" id="customerCurrency" name="customerCurrency"
                               th:value="${invoice.contact.currency}"
                               placeholder="KRW" readonly>
                    </div>

                    <div class="form-group">
                        <label for="customerBillTo">Bill To</label>
                        <input type="text" id="customerBillTo" name="customerBillTo"
                               th:value="${invoice.contact.billTo}"
                               placeholder="City" readonly>
                    </div>

                    <div class="form-group">
                        <label for="salesPerson">Salesperson</label>
                        <input type="text" id="salesPerson" name="salesPerson"
                               th:value="${invoice.salesPerson}">
                    </div>
                </div>

                <div class="form-grid" style="grid-template-columns: 1fr 1fr 1fr; gap: 10px; margin-bottom: 15px;">

                    <div class="form-group">
                        <label for="frequency">Frequency <span style="color:red">*</span></label>
                        <select id="frequency" name="frequency" required style="width: 100%; height: 39px; padding: 6px; border: 1px solid #ccc; border-radius: 4px;">
                            <option value="" disabled th:selected="${invoice.frequency == null}">Select</option>
                            <option value="DAILY" th:selected="${invoice.frequency != null and invoice.frequency.name() == 'DAILY'}">Daily</option>
                            <option value="WEEKLY" th:selected="${invoice.frequency != null and invoice.frequency.name() == 'WEEKLY'}">Weekly</option>
                            <option value="MONTHLY" th:selected="${invoice.frequency != null and invoice.frequency.name() == 'MONTHLY'}">Monthly</option>
                            <option value="YEARLY" th:selected="${invoice.frequency != null and invoice.frequency.name() == 'YEARLY'}">Yearly</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label for="frequencyInterval">Interval <span style="color:red">*</span></label>
                        <div style="display: flex; align-items: center;">
                            <input type="number" id="frequencyInterval" name="frequencyInterval"
                                   th:value="${invoice.frequencyInterval}" min="1" required
                                   style="width: 100%;">
                        </div>
                    </div>

                    <div class="form-group" style="display: flex; flex-direction: column; justify-content: flex-end;">
                        <label style="cursor: pointer; display: flex; align-items: center; justify-content: center; height: 37px; background: #fff; border: 1px solid #ccc; border-radius: 4px; padding: 0 10px; font-size: 14px; color: #333; margin-bottom: 0px;">
                            <input type="checkbox" id="autoSend" name="autoSend"
                                   th:checked="${invoice.autoSend}"
                                   style="margin-right: 8px; width: 16px; height: 16px; cursor: pointer;">
                            Auto Send
                        </label>
                    </div>
                </div>
            </div>

            <div class="section-right">
                <div class="form-grid" style="grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 0px">
                    <div class="form-group">
                        <label for="templateNumber">Invoice #</label>
                        <input type="text" id="templateNumber" name="templateNumber"
                               th:value="${invoice.templateNumber}" readonly style="background-color: #f0f0f0;">
                    </div>

                    <div class="form-group">
                        <label for="reference">Reference</label>
                        <input type="number" id="reference" name="reference"
                               th:value="${invoice.reference}">
                    </div>
                </div>

                <div class="form-grid" style="margin-bottom: 0; grid-template-columns: 1fr 1fr; gap: 10px;">
                    <div class="form-group">
                        <label for="startDate">Start Date <span style="color:red">*</span></label>
                        <input type="date" id="startDate" name="startDate"
                               th:value="${invoice.startDate}" required>
                    </div>
                    <div class="form-group">
                        <label for="dueDateDays">Due Date Days<span style="color:red">*</span></label>
                        <input type="number" id="dueDateDays" name="dueDateDays"
                               th:value="${invoice.dueDateDays}" required>
                    </div>
                </div>

                <div class="form-grid" style="margin-bottom: 0; grid-template-columns: 1fr 1fr; gap: 10px;">
                    <div class="form-group">
                        <label for="endDate">End Date (optional)<span style="color:red">*</span></label>
                        <input type="date" id="endDate" name="endDate"
                               th:value="${invoice.endDate}">
                    </div>
                </div>
            </div>
        </div>

        <h3>Items</h3>
        <button type="button" class="btn btn-secondary" onclick="addItem()" style="padding: 5px 10px; font-size: 16px;">+</button>
        <table class="items-table">
            <thead>
            <tr>
                <th>Product</th>
                <th>Description</th>
                <th class="width-sm text-right">Price</th>
                <th class="width-sm text-right">Quantity</th>
                <th class="width-sm text-right">Discount</th>
                <th class="width-sm text-right">Amount</th>
                <th style="width: 20px;"></th>
            </tr>
            </thead>
            <tbody id="invoiceItems">
            <tr th:each="item, stat : ${invoice.items}" class="item-row">

                <td>
                    <select th:name="|items[${stat.index}].product.id|" class="product-select" style="width: 95%;" required>
                        <option value="">Select Product</option>
                        <option th:each="prod : ${products}"
                                th:value="${prod.id}"
                                th:text="${prod.name}"
                                th:selected="${item.product != null and prod.id == item.product.id}"
                                th:data-price="${prod.price}"
                                th:data-desc="${prod.description}">
                            Apple
                        </option>
                    </select>
                </td>
                <td>
                    <input type="text" th:name="|items[${stat.index}].description|"
                           th:value="${item.product != null ? item.product.description : ''}"
                           placeholder="product description" style="width: 95%;" readonly>
                </td>
                <td>
                    <input type="number" th:name="|items[${stat.index}].price|"
                           th:value="${item.product != null ? item.product.price : ''}"
                           placeholder="0" class="text-right calc-input" style="width: 95%;" readonly>
                </td>
                <td>
                    <input type="number" th:name="|items[${stat.index}].quantity|"
                           th:value="${item.quantity}"
                           placeholder="0" class="text-right calc-input" style="width: 95%;">
                </td>
                <td>
                    <input type="number" th:name="|items[${stat.index}].discount|"
                           th:value="${item.discount}"
                           placeholder="0" class="text-right calc-input" style="width: 95%;">
                </td>
                <td class="text-right" style="vertical-align: middle;">
                    <span class="amount-display" th:text="${item.amount}">0.00</span>
                    <input type="hidden" th:name="|items[${stat.index}].amount|"
                           th:value="${item.amount}" class="row-amount">
                </td>
                <td class="delete-cell">
                    <button type="button" th:if="${!stat.first}" onclick="removeRow(this)" style="color:red; border:none; background:none; cursor:pointer;">&times;</button>
                </td>
            </tr>
            </tbody>
        </table>

        <div style="display: flex; justify-content: flex-end; margin-top: 20px;">
            <div style="width: 250px;">
                <div style="display: flex; justify-content: space-between; margin-bottom: 10px;">
                    <span>Subtotal</span>
                    <span id="subtotal" style="font-weight: bold;">0.00</span>
                </div>
                <div style="display: flex; justify-content: space-between; margin-bottom: 10px; color: #888;">
                    <span>Tax (10%)</span>
                    <span id="tax">0.00</span>
                </div>
                <div style="display: flex; justify-content: space-between; border-top: 2px solid #333; padding-top: 10px; font-size: 18px; font-weight: bold;">
                    <span>Total Amount</span>
                    <input type="hidden" name="total" id="hiddenTotal" th:value="${invoice.total}">
                    <span id="totalAmount" style="color: var(--primary-color);" th:text="${invoice.total}">0.00</span>
                </div>
            </div>
        </div>

        <div class="actions">
            <button type="button" class="btn btn-secondary" style="margin-right: auto;">
                Create payment link
            </button>

            <button type="button" onclick="location.href='/invoices'" class="btn btn-secondary">Cancel</button>
            <button type="submit" class="btn btn-primary" onclick="setStatusAndSubmit('DRAFT')">
                Save Changes
            </button>
            <button type="submit" class="btn btn-primary" onclick="setStatusAndSubmit('IN_REVIEW')">
                Save & Submit
            </button>
        </div>

    </form>
</div>

</body>
</html>
