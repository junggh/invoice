<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>

<div th:fragment="sidebar" id="sidebar" class="sidebar">
  <div class="sidebar-logo">
    <span class="logo-text">ZeniBooks</span>
    <i class="fas fa-bars" onclick="window.toggleSidebar()"></i>
  </div>
  <ul class="sidebar-menu">
    <li><a href="/invoices"><i class="fas fa-file-invoice"></i> <span class="menu-text">Invoices</span></a></li>
    <li><a href="/contact"><i class="fas fa-address-book"></i> <span class="menu-text">Contact</span></a></li>
    <li><a href="/product"><i class="fas fa-box-open"></i> <span class="menu-text">Product</span></a></li>
    <li><a href="/admin/users"><i class="fas fa-users"></i> <span class="menu-text">Users</span></a></li>
    <li><a href="/subscribe"><i class="fas fa-credit-card"></i> <span class="menu-text">Subscribe</span></a></li>
  </ul>

  <script>
    window.toggleSidebar = function() {
        const sidebar = document.getElementById("sidebar");
        if (sidebar) {
            sidebar.classList.toggle("collapsed");
        }
    };
  </script>
</div>

<div th:fragment="topbar" class="topbar">
  <div class="topbar-company" th:text="${globalCompanyName ?: 'ZeniBooks'}">Demo Company</div>

  <div class="topbar-icons">
    <i class="fas fa-plus"></i>
    <i class="fas fa-search"></i>
    <i class="far fa-bell"></i>
    <i class="fas fa-th"></i>
    <div class="profile-dropdown">
      <div class="profile-avatar" th:text="${globalUserInitials ?: 'JY'}" onclick="window.toggleProfileMenu(event)">JY</div>

      <div id="profileMenu" class="profile-menu">
        <a href="#">Profile & Account</a>
        <a href="#">Setting</a>
        <a href="#">Files</a>
        <a href="#">Help page</a>
        <a href="#" onclick="document.getElementById('logoutForm').submit()">Log out</a>
        <form id="logoutForm" th:action="@{/logout}" method="post" style="display:none"></form>
      </div>
    </div>
  </div>
  <script>
    window.toggleProfileMenu = function(event) {
        event.stopPropagation();
        const menu = document.getElementById("profileMenu");
        if (menu) {
            menu.classList.toggle("show");
        }
    };

    // 초대장 성공/오류 알림
    const params = new URLSearchParams(window.location.search);
    const tokenSuccess = params.get('tokenSuccess');
    const tokenError = params.get('tokenError');
    if (tokenSuccess) {
        alert(tokenSuccess);
        const u = new URL(window.location);
        u.searchParams.delete('tokenSuccess');
        window.history.replaceState({}, '', u);
    } else if (tokenError) {
        alert(tokenError);
        const u = new URL(window.location);
        u.searchParams.delete('tokenError');
        window.history.replaceState({}, '', u);
    }

    // 권한 부족 알림
    if (new URLSearchParams(window.location.search).get('forbidden') === 'true') {
        alert('You do not have permission to access that page.');
        const url = new URL(window.location);
        url.searchParams.delete('forbidden');
        window.history.replaceState({}, '', url);
    }

    // 바탕 화면 클릭 시 메뉴 닫기
    document.addEventListener('click', function(event) {
        if (!event.target.closest('.profile-avatar')) {
            const menu = document.getElementById("profileMenu");
            if (menu && menu.classList.contains('show')) {
                menu.classList.remove('show');
            }
        }
    });
  </script>
</div>

</body>
</html>
