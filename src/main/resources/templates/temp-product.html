<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Create Product (Temp)</title>
    <style>
        body { font-family: sans-serif; padding: 20px; }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-weight: bold; }
        input, textarea { width: 300px; padding: 8px; }
        button { padding: 10px 20px; background-color: #007bff; color: white; border: none; cursor: pointer; }
    </style>
</head>
<body>

<h2>Create Product (Temporary)</h2>

<form th:action="@{/product}" th:object="${product}" method="post">

    <div class="form-group">
        <label>Product Name</label>
        <input type="text" th:field="*{name}" required placeholder="Product Name">
    </div>

    <div class="form-group">
        <label>Description</label>
        <input type="text" th:field="*{description}" placeholder="Description">
    </div>

    <div class="form-group">
        <label>Price</label>
        <input type="number" th:field="*{price}" step="0.01" required placeholder="0.00">
    </div>

    <div class="form-group">
        <label>Tax Rate (e.g., 0.1 for 10%)</label>
        <input type="number" th:field="*{taxRate}" step="0.01" placeholder="0.1">
    </div>

    <button type="submit">Save Product</button>
</form>

<br>
<a href="/invoices">Go to Dashboard</a>

</body>
</html>
