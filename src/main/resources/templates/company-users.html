<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="_csrf" th:content="${_csrf.token}"/>
    <meta name="_csrf_header" th:content="${_csrf.headerName}"/>
    <title>User Management</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">

    <link rel="stylesheet" th:href="@{/css/homestyle.css}">
    <link rel="stylesheet" th:href="@{/css/layout.css}">
    <style>
        .user-table { width: 100%; border-collapse: collapse; margin-top: 10px; }
        .user-table th, .user-table td { border-bottom: 1px solid var(--border-color); padding: 15px; text-align: left; }
        .role-badge {
            display: inline-block; padding: 4px 14px; border-radius: 20px;
            font-size: 13px; font-weight: 600; cursor: pointer; border: none;
            transition: opacity 0.2s;
        }
        .role-badge:hover { opacity: 0.8; }
        .role-admin { background: #e3f2fd; color: #1976d2; }
        .role-user { background: #f5f5f5; color: #555; }

        /* 초대 모달 전용 디자인 */
        .modal-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.5); z-index: 2000;
            display: none; justify-content: center; align-items: center;
        }
        .modal-content {
            background: white; width: 400px; padding: 30px; border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.2);
        }
        .modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        .modal-header h3 { margin: 0; font-size: 18px; color: #333; }
        .close-btn { font-size: 24px; cursor: pointer; color: #aaa; }
        .close-btn:hover { color: #333; }
    </style>
</head>
<body>

<div th:replace="~{fragments/nav :: sidebar}"></div>

<div class="main-wrapper">

    <div th:replace="~{fragments/nav :: topbar}"></div>

    <div class="content-area">

        <div class="container">

            <div class="header" style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 30px; border-bottom: 1px solid var(--border-color); padding-bottom: 15px;">
                <h2 style="margin: 0;">Members List</h2>
                <div>
                    <button th:if="${#authorization.expression('hasAuthority(''ADMIN'')')}"
                            type="button" class="btn btn-primary" onclick="openInviteModal()">+ Invite User</button>
                    <a href="javascript:history.back()" class="btn" style="background: white; border: 1px solid #ddd; color: #555; text-decoration: none; margin-left: 10px;">Back</a>
                </div>
            </div>

            <table class="user-table">
                <thead>
                <tr>
                    <th>User</th>
                    <th>Role</th>
                    <th>Last Login</th>
                    <th>Joined (UTC)</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="user : ${users}">
                    <td>
                        <strong th:text="${user.name}">User name</strong><br>
                        <small style="color:gray;" th:text="${user.email}">email@email.com</small>
                    </td>
                    <td>
                        <!-- 자기 자신은 Role 변경 불가 (세션 불일치 문제 방지) -->
                        <button class="role-badge"
                                th:classappend="${user.role == 'ADMIN'} ? 'role-admin' : 'role-user'"
                                th:text="${user.role}"
                                th:if="${user.memberId != currentMemberId}"
                                th:attr="onclick='openRoleModal(' + ${user.memberId} + ', \'' + ${user.role} + '\', \'' + ${user.name} + '\')'">Role</button>
                        <span class="role-badge"
                              th:classappend="${user.role == 'ADMIN'} ? 'role-admin' : 'role-user'"
                              th:text="${user.role}"
                              th:if="${user.memberId == currentMemberId}"
                              style="cursor: default; opacity: 0.6;"
                              title="You cannot change your own role">Me</span>
                    </td>
                    <td style="color: gray;" th:text="${user.lastLogin}">20 mins ago</td>
                    <td th:text="${user.joinedDate}">Jan 15 2025</td>
                </tr>
                </tbody>
            </table>

        </div>
    </div>
</div>

<div id="roleModal" class="modal-overlay">
    <div class="modal-content">
        <div class="modal-header">
            <h3>Change Role</h3>
            <span class="close-btn" onclick="closeRoleModal()">&times;</span>
        </div>
        <div>
            <p style="color: #666; font-size: 14px; margin-bottom: 20px;">
                Select a role for <strong id="roleModalName"></strong>
            </p>
            <div style="display: flex; flex-direction: column; gap: 10px; margin-bottom: 20px;">
                <label style="display: flex; align-items: center; padding: 12px 16px; border: 2px solid #ddd; border-radius: 8px; cursor: pointer; transition: border-color 0.2s;" id="roleOptionAdmin" onclick="selectRole('ADMIN')">
                    <input type="radio" name="roleSelect" value="ADMIN" style="margin-right: 12px;">
                    <div>
                        <div style="font-weight: 600; font-size: 14px;">ADMIN</div>
                        <div style="font-size: 12px; color: #888;">Can manage members, invoices, and company settings</div>
                    </div>
                </label>
                <label style="display: flex; align-items: center; padding: 12px 16px; border: 2px solid #ddd; border-radius: 8px; cursor: pointer; transition: border-color 0.2s;" id="roleOptionUser" onclick="selectRole('USER')">
                    <input type="radio" name="roleSelect" value="USER" style="margin-right: 12px;">
                    <div>
                        <div style="font-weight: 600; font-size: 14px;">USER</div>
                        <div style="font-size: 12px; color: #888;">Can view and create invoices only</div>
                    </div>
                </label>
            </div>
            <div style="display: flex; justify-content: flex-end; gap: 10px;">
                <button class="btn" style="background: white; border: 1px solid #ddd;" onclick="closeRoleModal()">Cancel</button>
                <button class="btn btn-primary" onclick="confirmRoleChange()">Save</button>
            </div>
        </div>
    </div>
</div>

<div id="inviteModal" class="modal-overlay">
    <div class="modal-content">
        <div class="modal-header">
            <h3>Invite Team Member</h3>
            <span class="close-btn" onclick="closeInviteModal()">&times;</span>
        </div>
        <div>
            <p style="color: #666; font-size: 14px; margin-bottom: 20px;">Enter your team member's email address to send an invitation link.</p>
            <div style="margin-bottom: 20px;">
                <label style="display: block; margin-bottom: 8px; font-weight: 600; font-size: 14px;">Email Address</label>
                <input type="email" id="inviteEmail" placeholder="businessman@example.com" style="width: 100%; padding: 10px; border: 1px solid #ddd; border-radius: 6px; box-sizing: border-box;">
            </div>
            <div style="display: flex; justify-content: flex-end; gap: 10px;">
                <button class="btn" style="background: white; border: 1px solid #ddd;" onclick="closeInviteModal()">Cancel</button>
                <button class="btn btn-primary" onclick="sendInvite()">Send Invite</button>
            </div>
        </div>
    </div>
</div>

<script>
    // ===== Role Change Modal =====
    let roleModalMemberId = null;
    let roleModalSelectedRole = null;

    function openRoleModal(memberId, currentRole, memberName) {
        roleModalMemberId = memberId;
        roleModalSelectedRole = currentRole;
        document.getElementById('roleModalName').textContent = memberName;
        document.getElementById('roleModal').style.display = 'flex';

        // 현재 Role에 맞는 라디오 버튼 선택 및 스타일 적용
        document.querySelectorAll('input[name="roleSelect"]').forEach(radio => {
            radio.checked = (radio.value === currentRole);
        });
        updateRoleOptionStyle();
    }

    function closeRoleModal() {
        document.getElementById('roleModal').style.display = 'none';
        roleModalMemberId = null;
        roleModalSelectedRole = null;
    }

    function selectRole(role) {
        roleModalSelectedRole = role;
        document.querySelector('input[name="roleSelect"][value="' + role + '"]').checked = true;
        updateRoleOptionStyle();
    }

    function updateRoleOptionStyle() {
        document.getElementById('roleOptionAdmin').style.borderColor = roleModalSelectedRole === 'ADMIN' ? '#1976d2' : '#ddd';
        document.getElementById('roleOptionUser').style.borderColor = roleModalSelectedRole === 'USER' ? '#1976d2' : '#ddd';
    }

    function confirmRoleChange() {
        if (!roleModalMemberId || !roleModalSelectedRole) return;

        const csrfToken = document.querySelector('meta[name="_csrf"]').getAttribute('content');
        const csrfHeader = document.querySelector('meta[name="_csrf_header"]').getAttribute('content');

        fetch('/admin/users/' + roleModalMemberId + '/role', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json', [csrfHeader]: csrfToken },
            body: JSON.stringify({ role: roleModalSelectedRole })
        })
        .then(response => {
            if (!response.ok) {
                return response.text().then(text => { throw new Error(text); });
            }
            closeRoleModal();
            location.reload();
        })
        .catch(error => { alert(error.message); });
    }

    // ===== Invite Modal =====
    function openInviteModal() {
        document.getElementById('inviteModal').style.display = 'flex';
    }

    function closeInviteModal() {
        document.getElementById('inviteModal').style.display = 'none';
        document.getElementById('inviteEmail').value = ''; // 입력창 초기화
    }

    function sendInvite() {
        const email = document.getElementById('inviteEmail').value;
        if (!email) {
            alert('Please enter the email of the employee you want to invite.');
            return;
        }

        const csrfToken = document.querySelector('meta[name="_csrf"]').getAttribute('content');
        const csrfHeader = document.querySelector('meta[name="_csrf_header"]').getAttribute('content');

        fetch('/api/invitations', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json', [csrfHeader]: csrfToken },
            body: JSON.stringify({ email: email })
        })
        .then(response => {
            if (!response.ok) {
                return response.text().then(text => { alert(text); });
            }
            closeInviteModal();
            alert('Invitation email successfully sent.');
        })
        .catch(error => { console.error('Error:', error); });
    }
</script>

</body>
</html>
