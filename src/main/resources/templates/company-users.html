<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>User Management</title>
    <link rel="stylesheet" th:href="@{/css/homestyle.css}">
    <style>
        table { width: 100%; border-collapse: collapse; margin-top: 20px; }
        th, td { border-bottom: 1px solid #ddd; padding: 15px; text-align: left; }
        .role-admin { color: #1976d2; font-weight: bold; }
        .role-user { color: #388e3c; font-weight: bold; }
    </style>
</head>
<body>
<div class="header">
    <span class="logo">User Management</span>
    <a href="javascript:history.back()" class="btn">Back</a>
</div>

<div class="content" style="padding: 20px;">
    <h2>Members List</h2>

    <table>
        <thead>
        <tr>
            <th>User</th>
            <th>Role</th>
            <th>Last Login</th>
            <th>Joined</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="user : ${users}">
            <td>
                <strong th:text="${user.name}">User name</strong><br>
                <small style="color:gray;" th:text="${user.email}">email@email.com</small>
            </td>
            <td>
                    <span th:classappend="${user.role == 'ADMIN'} ? 'role-admin' : 'role-user'"
                          th:text="${user.role}">Role</span>
            </td>
            <td style="color: gray;" th:text="${user.lastLogin}">20 mins ago</td>
            <td th:text="${user.joinedDate}">Jan 15 2025</td>
        </tr>
        </tbody>
    </table>
</div>
</body>
</html>
